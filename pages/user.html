<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriScan - User Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header id="header-section">
    <div class="logo">
      <img src="../images/logo_2.PNG" alt="NutriScan Logo" onclick="goToHomepage()">
      <div>
        <h1 onclick="goToHomepage()">NutriScan</h1>
        <p onclick="goToHomepage()">One click away from a healthier future</p>
      </div>
    </div>

    <nav>
      <a href="../index.html">Home</a>
      <div class="dropdown">
        <a href="products_all.html">Products &#11206;</a>
        <div class="dropdown-content">
          <a href="beverages.html">Beverages</a>
          <a href="dairy.html">Dairy</a>
          <a href="frozenfoods.html">Frozen food</a>
        </div>
      </div>
      <a href="information.html">Information</a>
      <a href="contactus.html">Contact us</a>
    </nav>

    <div id="userArea">
      <a href="login.html" id="loginLink">Log in</a>
      <a href="signup.html" id="signupLink">Sign up</a>
    </div>
  </header>

  <main>
    <h2>Choose filters</h2>

    <div class="container">
      <div class="category">General</div>
      <div class="filterDiv" data-filter="No needed">No needed</div>

      <div class="category">Allergies</div>
      <div class="filterDiv" data-filter="Lactose">Lactose</div>
      <div class="filterDiv" data-filter="Glucose">Glucose</div>
      <div class="filterDiv" data-filter="Shellfish">Shellfish</div>
      <div class="filterDiv" data-filter="Citrus">Citrus</div>
      <div class="filterDiv" data-filter="Nuts">Nuts</div>
      <div class="filterDiv" data-filter="Eggs">Eggs</div>

      <div class="category">Nutrition label</div>
      <div class="filterDiv" data-filter="Sodium">Sodium</div>
      <div class="filterDiv" data-filter="Fat">Fat</div>
      <div class="filterDiv" data-filter="Carbohydrates">Carbohydrates</div>
      <div class="filterDiv" data-filter="Protein">Protein</div>
      <div class="filterDiv" data-filter="Sugar">Sugar</div>
    </div>

    <button id="applyBtn" class="apply-btn hidden">Apply</button>
  </main>

  <script>
    function goToHomepage() {
      window.location.href = "../index.html";
    }
  </script>

  <script src="../js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - NutriScan</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="signup-container">
    <h1>Sign up</h1>

    <form id="signupForm">
      <label for="newUsername">Username</label>
      <input type="text" id="newUsername" name="username" required>

      <label for="newPassword">Password</label>
      <input type="password" id="newPassword" name="password" required>

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required>

      <button type="submit">Sign up</button>
    </form>

    <p id="signupMessage"></p>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', function(event) {
      event.preventDefault();

      const newUsername = document.getElementById('newUsername').value.trim();
      const newPassword = document.getElementById('newPassword').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();
      const signupMessage = document.getElementById('signupMessage');

      if (newPassword !== confirmPassword) {
        signupMessage.textContent = 'Passwords do not match.';
        signupMessage.className = 'error-message';
        return;
      }

      const users = JSON.parse(localStorage.getItem('users')) || [];
      const existingUser = users.find(user => user.username === newUsername);

      if (existingUser) {
        signupMessage.textContent = 'Username already exists.';
        signupMessage.className = 'error-message';
        return;
      }

      users.push({ username: newUsername, password: newPassword });
      localStorage.setItem('users', JSON.stringify(users));

      signupMessage.textContent = 'User created successfully.';
      signupMessage.className = 'success-message';

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    });
  </script>
</body>
</html>
